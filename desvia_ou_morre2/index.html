import random
import math
# ============================
# SKINS (8 opções)
# crie sprites com esses nomes no microStudio
# ============================
SKINS = [
  "balao_vermelho", "variaves/balao_azul",
  "variaves/balao_verde", "variaves/balao_amarelho",
  "variaves/sprite", "variaves/sprite2",
  "variaves/balao_laranja", "variaves/balao_ciano",
]
# posições da grade: 4 colunas x 2 linhas
GRID_COLS = 4
CELL      = 38   # tamanho da célula (área de toque)
DURACAO_DIA = 60 * 60
DURACAO_POR_DO_SOL = 20 * 60
DURACAO_NOITE = 2 * 60 * 60
DURACAO_NASCER_DO_SOL = 28 * 60
DURACAO_CICLO_CEU = DURACAO_DIA + DURACAO_POR_DO_SOL + DURACAO_NOITE + DURACAO_NASCER_DO_SOL
ESTRELAS = [
  (-0.43, 0.31), (-0.31, 0.42), (-0.18, 0.27), (-0.04, 0.39),
  (0.08, 0.28), (0.21, 0.43), (0.36, 0.32), (0.45, 0.12),
  (-0.39, -0.02), (-0.22, 0.08), (-0.08, -0.09), (0.12, 0.06),
  (0.29, -0.08), (0.41, -0.19), (-0.31, -0.24), (0.04, -0.31),
]
NUVENS = [
  (-0.28, 0.22, 0.37, 0.12, 0.006, 0),
  (0.27, 0.34, 0.30, 0.10, -0.005, 1),
  (-0.04, 0.02, 0.43, 0.11, 0.004, 2),
]
NUVENS_PIXEL = [
  [
    [(7, 12)], [(6, 15)], [(4, 18)], [(3, 20)],
    [(2, 22)], [(1, 23)], [(0, 24)], [(1, 24)],
    [(2, 22)], [(4, 20)], [(6, 18)], [(8, 16)],
  ],
  [
    [(4, 8), (15, 19)], [(3, 10), (13, 21)], [(2, 22)],
    [(1, 23)], [(0, 24)], [(0, 24)], [(1, 24)],
    [(2, 23)], [(3, 21)], [(5, 19)], [(7, 17)], [(9, 15)],
  ],
  [
    [(14, 19)], [(12, 21)], [(6, 11), (12, 22)],
    [(4, 23)], [(2, 24)], [(1, 24)], [(0, 23)],
    [(1, 22)], [(3, 20)], [(5, 18)], [(7, 16)], [(8, 15)],
  ],
]
CEU_DIA = [
  "#3f7eb3", "#4386ba", "#4d90c1", "#5d9dc6",
  "#70aacb", "#86b6cf", "#9cbfca", "#b2c5bd",
  "#c5c6ad", "#d5c19a", "#e1bc8a", "#e9b77d",
  "#ebb174", "#e8aa6d", "#e1a16a", "#d99b69",
]
CEU_NOITE = [
  "#11172e", "#141b36", "#18213f", "#1d2748",
  "#232d4f", "#293353", "#2e3958", "#333f5e",
  "#384464", "#3d4a69", "#424f6e", "#475474",
  "#4c5a79", "#515f7e", "#566483", "#5b6988",
]
CEU_ENTARDECER = [
  "#44385e", "#514063", "#614668", "#744c6b",
  "#89546d", "#a05d6d", "#b6676b", "#ca7169",
  "#db7c6a", "#e78870", "#ed9677", "#f0a27d",
  "#eda980", "#e6a77a", "#dc9f73", "#d3976d",
]
SOL_PIXEL = [
  "0011100", "0111110", "1111111", "1111111",
  "1111111", "0111110", "0011100",
]
LUA_PIXEL = [
  "0011100", "0111110", "1111110", "1111110",
  "0111100", "0011000", "0000000",
]
COLINA_DISTANTE = [
  6, 6, 7, 8, 9, 10, 12, 14, 15, 15, 14, 13, 12, 11, 10, 9,
  8, 7, 6, 6, 6, 7, 8, 9, 10, 11, 12, 13, 13, 12, 10, 8,
]
COLINA_PROXIMA = [
  8, 8, 9, 10, 11, 12, 13, 14, 14, 13, 12, 10, 9, 8, 7, 7,
  8, 9, 10, 11, 12, 13, 14, 15, 15, 14, 13, 12, 11, 10, 9, 8,
]
# ============================
# AUXILIARES
# ============================
def chave(clica):
  return getattr(keyboard, clica, 0)
def captura(x, y, a, l):
  return (touch.touching and
    mouse.x > x - l/2 and mouse.x < x + l/2 and
    mouse.y > y - a/2 and mouse.y < y + a/2)
def celula_pos(i):
  # devolve (x, y) da célula i na grade
  col = i % GRID_COLS
  lin = i // GRID_COLS
  x = -57 + col * CELL
  y = 25 - lin * 50
  return x, y
def apertou(k):
  # detecta o "clique" da tecla (só dispara 1 vez)
  global teclas_prev
  agora = chave(k) > 0
  antes = teclas_prev.get(k, False)
  teclas_prev[k] = agora
  return agora and not antes
def tocou():
  # detecta o "clique" do toque (só dispara 1 vez)
  global toque_prev
  agora = touch.touching
  antes = toque_prev
  toque_prev = agora
  return agora and not antes
def locariza_x():
  return (int(random.random() * 11) - 5) * 16
def rotacao_aleatoria():
  return (5 + random.random() * 7) * (1 if random.random() < 0.5 else -1)
def desenha_obstaculo(x, y, largura, altura, angulo):
  screen.setDrawRotation(angulo)
  screen.drawSprite("obstaculo", x, y, largura, altura)
  screen.setDrawRotation(0)
def nivel_noite():
  tempo = sky_frames % DURACAO_CICLO_CEU
  if tempo < DURACAO_DIA:
    return 0
  if tempo < DURACAO_DIA + DURACAO_POR_DO_SOL:
    return (tempo - DURACAO_DIA) / DURACAO_POR_DO_SOL
  if tempo < DURACAO_DIA + DURACAO_POR_DO_SOL + DURACAO_NOITE:
    return 1
  return 1 - (tempo - DURACAO_DIA - DURACAO_POR_DO_SOL - DURACAO_NOITE) / DURACAO_NASCER_DO_SOL
def intensidade_entardecer():
  tempo = sky_frames % DURACAO_CICLO_CEU
  inicio_amanhecer = DURACAO_DIA + DURACAO_POR_DO_SOL + DURACAO_NOITE
  if DURACAO_DIA <= tempo < DURACAO_DIA + DURACAO_POR_DO_SOL:
    progresso = (tempo - DURACAO_DIA) / DURACAO_POR_DO_SOL
    return math.sin(math.pi * progresso)
  if inicio_amanhecer <= tempo:
    progresso = (tempo - inicio_amanhecer) / DURACAO_NASCER_DO_SOL
    return math.sin(math.pi * progresso)
  return 0
def mistura_cor(cor1, cor2, progresso):
  progresso = max(0, min(1, progresso))
  vermelho = int(cor1[1:3], 16) + (int(cor2[1:3], 16) - int(cor1[1:3], 16)) * progresso
  verde = int(cor1[3:5], 16) + (int(cor2[3:5], 16) - int(cor1[3:5], 16)) * progresso
  azul = int(cor1[5:7], 16) + (int(cor2[5:7], 16) - int(cor1[5:7], 16)) * progresso
  return "#%02x%02x%02x" % (int(vermelho), int(verde), int(azul))
def desenha_mascara_pixel(mascara, centro_x, centro_y, tamanho, cor):
  celula = tamanho / len(mascara)
  for linha in range(len(mascara)):
    pixels = mascara[linha]
    inicio = pixels.find("1")
    fim = pixels.rfind("1")
    if inicio < 0:
      continue
    largura_linha = (fim - inicio + 1) * celula
    x_linha = centro_x + (inicio + fim + 1 - len(pixels)) * celula / 2
    y_linha = centro_y + tamanho / 2 - (linha + 0.5) * celula
    screen.fillRect(x_linha, y_linha, largura_linha, celula, cor)
def desenha_sol_pixel(x, y, brilho):
  screen.setAlpha(brilho)
  screen.fillRect(x, y + 13, 3, 5, "#f7bd60")
  screen.fillRect(x, y - 13, 3, 5, "#f7bd60")
  screen.fillRect(x - 13, y, 5, 3, "#f7bd60")
  screen.fillRect(x + 13, y, 5, 3, "#f7bd60")
  desenha_mascara_pixel(SOL_PIXEL, x, y, 21, "#f9c968")
  screen.fillRect(x - 3, y + 3, 6, 3, "#ffe9a1")
def desenha_colina(perfil, cor):
  colunas = 64
  largura_pixel = screen.width / colunas
  altura_pixel = screen.height / 80
  for coluna in range(colunas):
    indice = int(coluna * len(perfil) / colunas)
    altura_colina = perfil[indice] * altura_pixel
    x = -screen.width / 2 + (coluna + 0.5) * largura_pixel
    y = -screen.height / 2 + altura_colina / 2
    screen.fillRect(x, y, largura_pixel + 0.5, altura_colina, cor)
def desenha_nuvem(centro_x, centro_y, largura, altura, velocidade, formato, noite):
  x = (centro_x * screen.width + sky_frames * velocidade + screen.width * 0.75) % (screen.width * 1.5) - screen.width * 0.75
  y = centro_y * screen.height
  mascara = NUVENS_PIXEL[formato]
  altura_pixel = altura / len(mascara)
  largura_pixel = largura / 24
  opacidade = 0.2 + (1 - noite) * 0.42
  cor_base = mistura_cor("#f3f8f8", "#8996ad", noite)
  cor_sombra = mistura_cor("#b5c8d2", "#525f7c", noite)
  for linha in range(len(mascara)):
    y_linha = y + altura / 2 - (linha + 0.5) * altura_pixel
    for inicio, fim in mascara[linha]:
      largura_linha = (fim - inicio) * largura_pixel
      x_linha = x + (inicio + fim - 24) * largura_pixel / 2
      screen.setAlpha(opacidade * 0.42)
      screen.fillRect(x_linha, y_linha - altura_pixel * 0.38, largura_linha, altura_pixel, cor_sombra)
      cor = mistura_cor(cor_base, "#ffffff", 0.2) if linha < 3 else cor_base
      if linha >= 8:
        cor = mistura_cor(cor_base, cor_sombra, 0.55)
      screen.setAlpha(opacidade)
      screen.fillRect(x_linha, y_linha, largura_linha, altura_pixel, cor)
def desenha_fundo():
  largura = screen.width
  altura = screen.height
  noite = nivel_noite()
  entardecer = intensidade_entardecer()
  altura_faixa = altura / len(CEU_DIA)
  for faixa in range(len(CEU_DIA)):
    cor = mistura_cor(CEU_DIA[faixa], CEU_NOITE[faixa], noite)
    cor = mistura_cor(cor, CEU_ENTARDECER[faixa], entardecer)
    y = altura / 2 - (faixa + 0.5) * altura_faixa
    screen.fillRect(0, y, largura, altura_faixa + 0.5, cor)

  sol_x = -largura * 0.24
  sol_y = altura * 0.23
  desenha_sol_pixel(sol_x, sol_y, 1 - noite)
  lua_x = largura * 0.29
  lua_y = altura * 0.27
  screen.setAlpha(noite)
  desenha_mascara_pixel(LUA_PIXEL, lua_x, lua_y, 18, "#f5f0d7")
  for indice in range(len(ESTRELAS)):
    x, y = ESTRELAS[indice]
    brilho = 0.45 + 0.55 * (0.5 + 0.5 * math.sin(sky_frames * 0.01 + indice * 1.7))
    screen.setAlpha(noite * brilho)
    tamanho = 1.4 + (indice % 3) * 0.6
    screen.fillRect(x * largura, y * altura, tamanho, tamanho, "#f4f4e8")

  for indice in range(len(NUVENS)):
    centro_x, centro_y, proporcao_largura, proporcao_altura, velocidade, formato = NUVENS[indice]
    desenha_nuvem(centro_x, centro_y, largura * proporcao_largura, altura * proporcao_altura, velocidade, formato, noite)

  cor_distante = mistura_cor("#83917c", "#40516c", noite)
  cor_distante = mistura_cor(cor_distante, "#a26e70", entardecer)
  cor_proxima = mistura_cor("#596f70", "#293954", noite)
  cor_proxima = mistura_cor(cor_proxima, "#795566", entardecer)
  desenha_colina(COLINA_DISTANTE, cor_distante)
  desenha_colina(COLINA_PROXIMA, cor_proxima)
  screen.setAlpha(1.0)
def aperta_comeca():
  return {
    "x":     locariza_x(),
    "y":     120,
    "angle": 0,
    "speed": int(random.random() * 2) + 2,
    "spin":  rotacao_aleatoria(),
    "state": "warning",
    "timer": 40,
  }
def reset(b):
  b["x"]     = locariza_x()
  b["y"]     = 120
  b["angle"] = 0
  b["spin"]  = rotacao_aleatoria()
  b["state"] = "warning"
  b["timer"] = 40
# ============================
# INIT
# ============================
def init():
  global heroi, shurikens, pontos, spedrun, sky_frames
  global apareca_GO, estado, skin_sel
  heroi = {"x": 0, "y": -35, "h": 44, "w": 23,
           "targetX": 0, "moving": False, "frame": 0}
  spedrun    = storage.get("bestScore") or 0
  skin_sel   = storage.get("skin") or 0   # lembra a última skin
  pontos     = 0
  sky_frames = 0
  apareca_GO = False
  estado     = "menu"
  shurikens = [aperta_comeca() for _ in range(3)]
# ============================
# GLOBAIS
# ============================
heroi       = {}
shurikens   = []
pontos      = 0
sky_frames  = 0
spedrun     = 0
apareca_GO  = False
estado      = "menu"
skin_sel    = 0
teclas_prev = {}
toque_prev  = False
init()  # ← popula tudo antes do primeiro frame
# ============================
# UPDATE
# ============================
def update():
  global estado, pontos, spedrun, apareca_GO, skin_sel, sky_frames
  if estado == "menu":
    if apertou("SPACE") or (tocou() and captura(0, 0, 200, 200)):
      estado = "escolha"
  elif estado == "escolha":
    # navegação pelo teclado
    if apertou("LEFT") or apertou("A"):
      skin_sel = (skin_sel - 1) % len(SKINS)
    if apertou("RIGHT") or apertou("D"):
      skin_sel = (skin_sel + 1) % len(SKINS)
    if apertou("UP") or apertou("W"):
      skin_sel = (skin_sel - GRID_COLS) % len(SKINS)
    if apertou("DOWN") or apertou("S"):
      skin_sel = (skin_sel + GRID_COLS) % len(SKINS)
    # toque: tocar numa célula seleciona ela
    if tocou():
      for i in range(len(SKINS)):
        cx, cy = celula_pos(i)
        if captura(cx, cy, CELL, CELL):
          skin_sel = i
      # botão JOGAR embaixo
      if captura(0, -75, 25, 100):
        storage.set("skin", skin_sel)
        estado = "jogo"
    # SPACE confirma a skin atual
    if apertou("SPACE"):
      storage.set("skin", skin_sel)
      estado = "jogo"
  elif estado == "jogo":
    sky_frames += 1
    if chave("LEFT") or chave("A"):
      heroi["x"] -= 2
    if chave("RIGHT") or chave("D"):
      heroi["x"] += 2
    heroi["x"] = max(-80, min(80, heroi["x"]))
    for b in shurikens:
      if "x" not in b:
        continue
      if b["state"] == "warning":
        b["angle"] = (b["angle"] + b["spin"] * 0.65) % 360
        b["timer"] -= 1
        if b["timer"] <= 0:
          b["state"] = "caindo"
      elif b["state"] == "caindo":
        b["y"]     -= b["speed"]
        b["angle"]  = (b["angle"] + b["spin"]) % 360
        dx = abs(b["x"] - heroi["x"])
        dy = abs(b["y"] - heroi["y"])
        if dx < 10 and dy < 10:
          apareca_GO = True
          estado = "gameover"
        if b["y"] < -130:
          reset(b)
          pontos += 1
    if pontos > spedrun:
      spedrun = pontos
      storage.set("bestScore", spedrun)
  elif estado == "gameover":
    if apertou("SPACE") or (tocou() and captura(0, 0, 200, 200)):
      init()
# ============================
# DRAW
# ============================
def draw():
  screen.clear()
  screen.setPixelated(1)
  desenha_fundo()
  if estado == "menu":
    screen.drawText("desvia_morre", 0, 20, 16, "#fff")
    screen.drawText("SPACE para jogar", 0, -5, 8, "#aaa")
    screen.drawText("Record: " + str(spedrun), 0, -20, 8, "#ff0")
  elif estado == "escolha":
    screen.drawText("Escolha a cor do balão", 0, 70, 10, "#fff")
    for i in range(len(SKINS)):
      cx, cy = celula_pos(i)
      # moldura: amarela na skin selecionada, cinza nas outras
      if i == skin_sel:
        screen.drawRect(cx, cy, CELL, CELL, "#ff0")
      else:
        screen.drawRect(cx, cy, CELL, CELL, "#555")
      screen.drawSprite(SKINS[i], cx, cy, 20, 38)
    screen.drawText("JOGAR", 0, -75, 12, "#0f0")
    screen.drawText("setas = mudar | SPACE = confirmar", 0, -95, 6, "#aaa")
  elif estado == "jogo":
    screen.drawSprite(SKINS[skin_sel], heroi["x"], heroi["y"], heroi["w"], heroi["h"])
    for b in shurikens:
      if "x" not in b:
        continue
      if b["state"] == "warning":
        progresso = 40 - b["timer"]
        pulso = 1 + 0.16 * math.sin(progresso * 0.38)
        screen.setAlpha(0.3 + 0.22 * (1 + math.sin(progresso * 0.38)) / 2)
        desenha_obstaculo(b["x"], 90, 16 * pulso, 16 * pulso, b["angle"])
        screen.setAlpha(1.0)
        screen.drawText("!", b["x"], 90, 12, "#f80")
      elif b["state"] == "caindo":
        pulso = 1 + 0.1 * math.sin(b["angle"] * 0.06)
        screen.setAlpha(0.16)
        desenha_obstaculo(b["x"], b["y"] + 14, 16, 16, b["angle"] - b["spin"] * 2)
        screen.setAlpha(0.34)
        desenha_obstaculo(b["x"], b["y"] + 7, 15, 15, b["angle"] - b["spin"])
        screen.setAlpha(1.0)
        desenha_obstaculo(b["x"], b["y"], 16 * pulso, 16 * pulso, b["angle"])
    screen.drawText("Pontos: " + str(pontos), -70, 80, 8, "#fff")
    screen.drawText("Record: " + str(spedrun), 50, 80, 8, "#ff0")
  elif estado == "gameover":
    screen.drawText("GAME OVER", 0, 20, 16, "#f00")
    screen.drawText("Pontos: " + str(pontos), 0, 0, 10, "#fff")
    screen.drawText("SPACE para reiniciar", 0, -20, 8, "#aaa")

</script></html>
