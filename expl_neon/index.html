<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explosão Neon</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050510;
      font-family: 'Trebuchet MS', sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .home-link {
      position: fixed;
      z-index: 10;
      top: 14px;
      left: 14px;
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      padding: 0 12px;
      border: 2px solid #f9c968;
      color: #fff;
      background: #17172a;
      box-shadow: 3px 3px 0 #090914;
      font: 700 12px 'Trebuchet MS', sans-serif;
      text-decoration: none;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .home-link:hover, .home-link:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #090914;
    }
    .home-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Jogo Explosão Neon"></canvas>
  <a class="home-link" href="../index.html">← Tela inicial</a>
  <script>
    const canvas = document.querySelector('#game');
    const context = canvas.getContext('2d');
    const balls = [];
    const particles = [];
    let score = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      context.fillStyle = '#050510';
      context.fillRect(0, 0, canvas.width, canvas.height);
    }

    function randomBall() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 6 + Math.random() * 12,
        hue: Math.floor(Math.random() * 360),
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3
      };
    }

    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 100; i += 1) {
      balls.push(randomBall());
    }

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      let targetIndex = -1;
      let nearestDistance = Infinity;
      for (let i = 0; i < balls.length; i += 1) {
        const ball = balls[i];
        const distance = Math.hypot(x - ball.x, y - ball.y);
        if (distance <= ball.radius + 16 && distance < nearestDistance) {
          targetIndex = i;
          nearestDistance = distance;
        }
      }

      if (targetIndex === -1) return;

      const [ball] = balls.splice(targetIndex, 1);
      score += 1;
      for (let newBall = 0; newBall < 4; newBall += 1) {
        balls.push(randomBall());
      }
      for (let particleIndex = 0; particleIndex < 15; particleIndex += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x: ball.x,
          y: ball.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 3,
          alpha: 1,
          hue: ball.hue
        });
      }
    });

    function draw() {
      context.fillStyle = 'rgba(5, 5, 16, 0.18)';
      context.fillRect(0, 0, canvas.width, canvas.height);

      for (const ball of balls) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx += (Math.random() - 0.5) * 0.08;
        ball.vy += (Math.random() - 0.5) * 0.08;
        ball.vx = Math.max(-2.5, Math.min(2.5, ball.vx));
        ball.vy = Math.max(-2.5, Math.min(2.5, ball.vy));
        if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) ball.vx *= -1;
        if (ball.y < ball.radius || ball.y > canvas.height - ball.radius) ball.vy *= -1;

        context.shadowBlur = 16;
        context.shadowColor = `hsl(${ball.hue}, 100%, 65%)`;
        context.fillStyle = `hsl(${ball.hue}, 100%, 65%)`;
        context.beginPath();
        context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        context.fill();
      }

      context.shadowBlur = 0;
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.alpha -= 0.05;
        context.globalAlpha = particle.alpha;
        context.fillStyle = `hsl(${particle.hue}, 100%, 65%)`;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        context.fill();
        if (particle.alpha <= 0) particles.splice(i, 1);
      }

      context.globalAlpha = 1;
      context.fillStyle = '#fff';
      context.font = '600 20px Trebuchet MS';
      context.textAlign = 'center';
      context.fillText(`Score: ${score}`, canvas.width / 2, 40);
      window.requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
